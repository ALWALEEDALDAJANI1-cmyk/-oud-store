<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>جلاغ العود | نفحات أصيلة تليق بالمجالس</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

<style>

/* =========================
   ألوان جلاغ الجديدة
========================= */

:root{

--jamr:#5c0f18;
--oud:#6b4b2a;
--cream:#f4efe6;
--black:#151515;
--white:#ffffff;

}

/* =========================
   أساسيات
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

html{
scroll-behavior:smooth;
}

body{

background:var(--cream);

color:var(--black);

overflow-x:hidden;

}

img{
display:block;
max-width:100%;
}

a{
text-decoration:none;
color:inherit;
}

/* =========================
   زخارف نجدية
========================= */

.najdi-top{

height:16px;

background:
repeating-linear-gradient(
90deg,
var(--jamr) 0px,
var(--jamr) 30px,
var(--oud) 30px,
var(--oud) 60px,
var(--cream) 60px,
var(--cream) 90px
);

border-bottom:2px solid var(--black);

}

.najdi-divider{

height:50px;

display:flex;

justify-content:center;

align-items:center;

font-size:22px;

letter-spacing:10px;

color:var(--jamr);

}

/* =========================
   الهيدر
========================= */

header{

background:rgba(244,239,230,.97);

position:sticky;

top:0;

z-index:999;

backdrop-filter:blur(10px);

border-bottom:1px solid #ddd;

}

.nav{

max-width:1300px;

margin:auto;

padding:16px 25px;

display:flex;

align-items:center;

justify-content:space-between;

}

.logo{

display:flex;

align-items:center;

gap:15px;

}

.logo img{

width:85px;

height:85px;

object-fit:contain;

}

.brand{

display:flex;

flex-direction:column;

}

.brand h1{

font-size:28px;

font-weight:900;

color:var(--jamr);

}

.brand span{

font-size:13px;

font-weight:700;

color:#666;

}

.menu{

display:flex;

gap:25px;

font-weight:800;

}

.menu a{

transition:.3s;

}

.menu a:hover{

color:var(--jamr);

}

/* =========================
   الواجهة الرئيسية
========================= */

.hero{

min-height:90vh;

position:relative;

display:flex;

align-items:center;

justify-content:center;

text-align:center;

overflow:hidden;

}

.hero::before{

content:"";

position:absolute;

inset:0;

background:

linear-gradient(
rgba(0,0,0,.55),
rgba(0,0,0,.55)
),

url('IMG_1763.jpeg');

background-size:cover;

background-position:center;

}

.hero-content{

position:relative;

z-index:2;

max-width:900px;

padding:20px;

color:white;

}

.hero-logo{

width:170px;

margin:auto;

margin-bottom:25px;

}

.hero h2{

font-size:82px;

font-weight:900;

line-height:1.1;

}

.hero p{

font-size:24px;

line-height:2;

margin-top:20px;

}

.hero-buttons{

margin-top:35px;

display:flex;

justify-content:center;

gap:15px;

flex-wrap:wrap;

}

.btn-main{

background:var(--jamr);

color:white;

padding:18px 34px;

border-radius:16px;

font-weight:900;

}

.btn-second{

background:var(--oud);

color:white;

padding:18px 34px;

border-radius:16px;

font-weight:900;

}

/* =========================
   الجوال
========================= */

@media(max-width:900px){

.menu{

display:none;

}

.logo img{

width:65px;

height:65px;

}

.brand h1{

font-size:22px;

}

.hero h2{

font-size:48px;

}

.hero p{

font-size:18px;

}

.hero-logo{

width:120px;

}

}

</style>

</head>

<body>

<div class="najdi-top"></div>

<header>

<div class="nav">

<div class="logo">

<img src="1532CBD5-CDE3-46F1-8619-22130CBAEC34.png">

<div class="brand">

<h1>جلاغ العود</h1>

<span>نفحات أصيلة تليق بالمجالس</span>

</div>

</div>

<div class="menu">

<a href="#offer">العرض</a>

<a href="#products">المختارات</a>

<a href="#story">الحكاية</a>

<a href="#meaning">جلاغ</a>

</div>

</div>

</header>

<section class="hero">

<div class="hero-content">

<img
src="1532CBD5-CDE3-46F1-8619-22130CBAEC34.png"
class="hero-logo"
>

<h2>

جلاغ العود

</h2>

<p>

يا مرحبا ترحيبة كلها أطياب

<br>

أحلى من العنبر وأزكى من العود

</p>

<div class="hero-buttons">

<a href="#products" class="btn-main">

تصفح المختارات

</a>

<a href="#offer" class="btn-second">

عرض الافتتاح

</a>

</div>

</div>

</section>

<div class="najdi-divider">

◈ ◈ ◈ ◈ ◈

</div>
