<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>جلاغ العود | للعود مقام .. وللطيب جلاغ</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

<style>

:root{
--jamr:#65111d;
--oud:#6b4b2a;
--cream:#f4efe6;
--dark:#161616;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
background:var(--cream);
overflow-x:hidden;
}

/* =========================
الشريط النجدي
========================= */

.top-pattern{
width:100%;
height:38px;
overflow:hidden;
}

.top-pattern img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

/* =========================
الهيدر
========================= */

header{

background:rgba(255,255,255,.08);

backdrop-filter:blur(14px);

border-bottom:1px solid rgba(255,255,255,.12);

position:fixed;

top:38px;

left:0;

width:100%;

z-index:999;

}

.navbar{

max-width:1400px;

margin:auto;

padding:8px 30px;

display:flex;

align-items:center;

justify-content:space-between;

}

.logo-area{

display:flex;

align-items:center;

gap:15px;

}

.logo-area img{
width:160px;
height:160px;
}

.brand h1{

font-size:30px;

font-weight:900;

color:var(--jamr);

}

.brand p{
font-size:18px;
font-weight:800;
}

.menu{

display:flex;

gap:28px;

}

.menu a{

text-decoration:none;

font-weight:800;

color:#222;

transition:.3s;

}

.menu a:hover{

color:var(--jamr);

}

/* =========================
الصورة الافتتاحية
========================= */

.hero{

height:100vh;

position:relative;

display:flex;

align-items:center;

justify-content:center;

background:
linear-gradient(
rgba(0,0,0,.18),
rgba(0,0,0,.18)
),
url("E283F998-94B2-4DE4-AF0A-C6802DDF8FAB.png");

background-size:cover;

background-position:center center;

background-repeat:no-repeat;

}

.hero-content{

position:relative;

z-index:2;

text-align:center;

color:white;

max-width:950px;

padding:20px;

}

.hero-logo{

width:190px;

margin:auto;

margin-bottom:25px;

filter:drop-shadow(0 10px 20px rgba(0,0,0,.35));

}

.hero h2{

font-size:82px;

font-weight:900;

line-height:1.1;

margin-bottom:20px;

}

.hero p{
font-size:24px;
line-height:2;
margin-bottom:35px;
animation:welcomeFade 5s ease forwards;
}

@keyframes welcomeFade{

0%{
opacity:1;
}

70%{
opacity:1;
}

100%{
opacity:0;
visibility:hidden;
}

}

.buttons{

position:absolute;

bottom:35px;

left:40px;

right:40px;

display:flex;

justify-content:space-between;

align-items:center;

}

.btn-primary{

background:var(--jamr);

color:white;

padding:12px 24px;

border-radius:14px;

font-weight:900;

text-decoration:none;

transition:.3s;

}

.btn-primary:hover{

transform:translateY(-2px);

}

.btn-secondary{

background:var(--oud);

color:white;

padding:12px 24px;

border-radius:14px;

font-weight:900;

text-decoration:none;

transition:.3s;

}

.btn-secondary:hover{

transform:translateY(-2px);

}

/* =========================
الجوال
========================= */
.trust-section{

padding:30px 12px;

background:var(--cream);

display:flex;

justify-content:center;

gap:12px;

}

.trust-card{

flex:1;

background:white;

border:2px solid var(--jamr);

border-radius:18px;

padding:16px 8px;

text-align:center;

}

.trust-icon{

font-size:24px;

margin-bottom:8px;

}

.trust-card h3{

font-size:16px;

color:var(--jamr);

margin-bottom:5px;

}

.trust-card p{

font-size:12px;

color:#666;

}
@media(max-width:900px){

.navbar{

padding:14px;

}

.menu{

display:none;

}

.logo-area img{

width:58px;

height:58px;

}

.brand h1{

font-size:22px;

}

.hero{

height:75vh;

}

.hero-logo{

width:130px;

}

.hero h2{

font-size:42px;

}

.hero p{

font-size:18px;

line-height:1.9;

}

.btn-primary,
.btn-secondary{

width:100%;

max-width:260px;

}

}

</style>

</head>

<body>

<a href="#">عن جلاغ العود</a>

</div>

</header>

<section class="hero">

<div class="hero-content">

يا مرحبا ترحيبة كلها أطياب

</p>

</div>

</div>

</section>

</body>

</html>
