<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>جلاغ العود | للعود مقام وللطيب جلاغ</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

<style>

:root{

--jamr:#5c0f18;
--oud:#6b4b2a;
--cream:#f4efe6;
--black:#151515;

}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

html{
scroll-behavior:smooth;
}

body{

background:var(--cream);

color:var(--black);

overflow-x:hidden;

}

a{
text-decoration:none;
color:inherit;
}

img{
display:block;
max-width:100%;
}

/* ======================
   النقش النجدي العلوي
====================== */

.najdi-bar{

height:18px;

background:
repeating-linear-gradient(
90deg,
#5c0f18 0px,
#5c0f18 25px,
#6b4b2a 25px,
#6b4b2a 50px,
#f4efe6 50px,
#f4efe6 75px
);

border-bottom:2px solid #151515;

}

/* ======================
   الهيدر
====================== */

header{

position:sticky;

top:0;

z-index:999;

background:rgba(244,239,230,.97);

backdrop-filter:blur(12px);

border-bottom:1px solid rgba(0,0,0,.08);

}

.nav{

max-width:1300px;

margin:auto;

padding:15px 25px;

display:flex;

align-items:center;

justify-content:space-between;

}

.logo{

display:flex;

align-items:center;

gap:15px;

}

.logo img{

width:80px;

height:80px;

object-fit:contain;

}

.brand h1{

font-size:28px;

font-weight:900;

color:var(--jamr);

}

.brand span{

font-size:13px;

font-weight:700;

color:#777;

}

.menu{

display:flex;

gap:25px;

font-weight:800;

}

.menu a:hover{

color:var(--jamr);

}

/* ======================
   الواجهة الرئيسية
====================== */

.hero{

min-height:90vh;

display:flex;

align-items:center;

justify-content:center;

text-align:center;

position:relative;

background:
linear-gradient(
rgba(0,0,0,.55),
rgba(0,0,0,.55)
),
url('IMG_1763.jpeg');

background-size:cover;

background-position:center;

}

.hero-content{

max-width:900px;

padding:20px;

color:white;

}

.hero-logo{

width:220px;

margin:auto;

margin-bottom:25px;

filter:
drop-shadow(0 10px 25px rgba(0,0,0,.4));

}

.hero h2{

font-size:78px;

font-weight:900;

}

.hero p{

margin-top:15px;

font-size:22px;

line-height:2;

}

.hero-buttons{

margin-top:35px;

display:flex;

justify-content:center;

gap:15px;

flex-wrap:wrap;

}

.btn-primary{

background:var(--jamr);

color:white;

padding:18px 35px;

border-radius:16px;

font-weight:900;

}

.btn-secondary{

background:var(--oud);

color:white;

padding:18px 35px;

border-radius:16px;

font-weight:900;

}

/* ======================
   الجوال
====================== */

@media(max-width:900px){

.menu{

display:none;

}

.logo img{

width:60px;
height:60px;

}

.brand h1{

font-size:22px;

}

.hero-logo{

width:150px;

}

.hero h2{

font-size:46px;

}

.hero p{

font-size:18px;

}

}

</style>

</head>

<body>

<div class="najdi-bar"></div>

<header>

<div class="nav">

<div class="logo">

<img src="1532CBD5-CDE3-46F1-8619-22130CBAEC34.png.png">

<div class="brand">

<h1>جلاغ العود</h1>

<span>
للعود مقام .. وللطيب جلاغ
</span>

</div>

</div>

<div class="menu">

<a href="#offer">العرض</a>

<a href="#products">المختارات</a>

<a href="#story">الحكاية</a>

<a href="#meaning">جلاغ</a>

</div>

</div>

</header>

<section class="hero">

<div class="hero-content">

<img
src="1532CBD5-CDE3-46F1-8619-22130CBAEC34.png.png"
class="hero-logo"
>

<h2>

جلاغ العود

</h2>

<p>

يا مرحبا ترحيبة كلها أطياب

<br>

أحلى من العنبر وأزكى من العود

</p>

<div class="hero-buttons">

<a href="#products" class="btn-primary">

تصفح المختارات

</a>

<a href="#offer" class="btn-secondary">

عرض الافتتاح

</a>

</div>

</div>

</section>
