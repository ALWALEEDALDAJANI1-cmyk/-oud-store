<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>جلاغ العود | للعود مقام .. وللطيب جلاغ</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

<style>

:root{
--jamr:#65111d;
--oud:#6b4b2a;
--cream:#f4efe6;
--dark:#161616;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
background:var(--cream);
overflow-x:hidden;
}

/* =========================
الشريط النجدي
========================= */

.top-pattern{
width:100%;
height:38px;
overflow:hidden;
}

.top-pattern img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

/* =========================
الهيدر
========================= */

header{

background:rgba(244,239,230,.97);

backdrop-filter:blur(10px);

border-bottom:1px solid rgba(0,0,0,.08);

position:sticky;

top:0;

z-index:999;

}

.navbar{

max-width:1400px;

margin:auto;

padding:16px 30px;

display:flex;

align-items:center;

justify-content:space-between;

}

.logo-area{

display:flex;

align-items:center;

gap:15px;

}

.logo-area img{

width:80px;

height:80px;

object-fit:contain;

}

.brand h1{

font-size:30px;

font-weight:900;

color:var(--jamr);

}

.brand p{

font-size:13px;

font-weight:700;

color:#777;

}

.menu{

display:flex;

gap:28px;

}

.menu a{

text-decoration:none;

font-weight:800;

color:#222;

transition:.3s;

}

.menu a:hover{

color:var(--jamr);

}

/* =========================
الصورة الافتتاحية
========================= */

.hero{

height:88vh;

position:relative;

display:flex;

align-items:center;

justify-content:center;

background:
linear-gradient(
rgba(0,0,0,.40),
rgba(0,0,0,.40)
),
url("E283F998-94B2-4DE4-AF0A-C6802DDF8FAB.png");

background-size:cover;

background-position:center;

background-repeat:no-repeat;

}

.hero-content{

position:relative;

z-index:2;

text-align:center;

color:white;

max-width:950px;

padding:20px;

}

.hero-logo{

width:190px;

margin:auto;

margin-bottom:25px;

filter:drop-shadow(0 10px 20px rgba(0,0,0,.35));

}

.hero h2{

font-size:82px;

font-weight:900;

line-height:1.1;

margin-bottom:20px;

}

.hero p{

font-size:24px;

line-height:2;

margin-bottom:35px;

}

.buttons{

display:flex;

justify-content:center;

gap:15px;

flex-wrap:wrap;

}

.btn-primary{

background:var(--jamr);

color:white;

padding:18px 34px;

border-radius:14px;

font-weight:900;

text-decoration:none;

transition:.3s;

}

.btn-primary:hover{

transform:translateY(-2px);

}

.btn-secondary{

background:var(--oud);

color:white;

padding:18px 34px;

border-radius:14px;

font-weight:900;

text-decoration:none;

transition:.3s;

}

.btn-secondary:hover{

transform:translateY(-2px);

}

/* =========================
الجوال
========================= */

@media(max-width:900px){

.navbar{

padding:14px;

}

.menu{

display:none;

}

.logo-area img{

width:58px;

height:58px;

}

.brand h1{

font-size:22px;

}

.hero{

height:75vh;

}

.hero-logo{

width:130px;

}

.hero h2{

font-size:42px;

}

.hero p{

font-size:18px;

line-height:1.9;

}

.btn-primary,
.btn-secondary{

width:100%;

max-width:260px;

}

}

</style>

</head>

<body>

<!-- الشريط النجدي -->

<div class="top-pattern">

<img src="342A87DA-4B8D-400A-A3C7-5105ECBF07E6.png">

</div>

<header>

<div class="navbar">

<div class="logo-area">

<img src="1532CBD5-CDE3-46F1-8619-22130CBAEC34.png.png">

<div class="brand">

<h1>جلاغ العود</h1>

<p>للعود مقام .. وللطيب جلاغ</p>

</div>

</div>

<div class="menu">

<a href="#">الرئيسية</a>

<a href="#">المختارات</a>

<a href="#">العروض</a>

<a href="#">عن جلاغ العود</a>

<a href="#">تواصل معنا</a>

</div>

</div>

</header>

<section class="hero">

<div class="hero-content">

<img
src="1532CBD5-CDE3-46F1-8619-22130CBAEC34.png.png"
class="hero-logo"
>

<h2>جلاغ العود</h2>

<p>

يا مرحبا ترحيبة كلها أطياب

<br>

أحلى من العنبر وأزكى من العود

</p>

<div class="buttons">

<a href="#" class="btn-primary">

تصفح المختارات

</a>

<a href="#" class="btn-secondary">

عرض الافتتاح

</a>

</div>

</div>

</section>

</body>

</html>
